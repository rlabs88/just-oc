apiVersion: agent-toolkit/v1

sources:
  - id: herdr
    description: Herdr pane and neighboring-agent control for OpenCode sessions launched inside Herdr
    repo: ogulcancelik/herdr
    skills:
      - herdr
    overrides:
      scope: project
      agents: [opencode]
      gitnored: true

osrc:
  - id: claude-code-system-prompts
    description: Extracted Claude Code prompt components used as a comparative design reference
    spec: Piebald-AI/claude-code-system-prompts
    guide:
      purpose: Study Claude Code identity, safety, task, tool, and communication prompt composition without creating a runtime dependency
      explore_when:
        - Designing or reviewing shared base prompts
        - Comparing role, tool, safety, and task-boundary instructions
      skip_when:
        - Implementing unrelated plugin behavior
      importance: high
      tags: [prompts, claude-code, reference, deep-wiki]
      related:
        skills: [deep-wiki]

  - id: codex
    description: Official OpenAI Codex source and base instruction references
    spec: openai/codex
    guide:
      purpose: Study Codex base instructions and harness behavior as a primary prompt-architecture reference
      explore_when:
        - Designing or reviewing shared base prompts
        - Comparing repository, tool, autonomy, and communication behavior
      skip_when:
        - Implementing unrelated plugin behavior
      importance: high
      tags: [prompts, codex, reference, deep-wiki]
      related:
        skills: [deep-wiki]

  - id: opencode
    description: Official OpenCode source for plugin, agent transform, hook, permission, and provider contracts
    spec: anomalyco/opencode
    guide:
      purpose: Verify the exact OpenCode extension points that just-oc plugins target
      explore_when:
        - Implementing or reviewing an OpenCode plugin or loader
        - Checking agent transforms, hooks, tool contracts, authentication, or model configuration
      skip_when:
        - Editing model-neutral prompt prose only
      importance: high
      tags: [opencode, plugins, runtime, reference, deep-wiki]
      related:
        skills: [deep-wiki]

  - id: tura
    description: Tura-AI coding-agent harness used to study its agent loop, prompt composition, and tool protocol
    spec: Tura-AI/tura
    guide:
      purpose: Distill Tura's software-engineering agent loop and assess which mechanisms can be adapted through supported OpenCode plugin surfaces
      explore_when:
        - Investigating RT-269 or related coding-agent harness designs
        - Comparing agent loops, prompt construction, tool protocols, and termination behavior
      skip_when:
        - Implementing unrelated OpenCode plugin behavior
      importance: high
      tags: [tura, coding-agent, harness, agent-loop, reference]
      related:
        skills: [just-lib, deep-wiki]

  - id: adhd
    description: Parallel divergent-ideation skill for coding agents, distilled into the Flux archetype prompt profile
    spec: UditAkhourii/adhd
    guide:
      purpose: Source of the generator/critic split, cognitive-frame fan-out, branch isolation, and score-cluster-prune convergence distilled into Flux
      explore_when:
        - Revising the Flux divergent-ideation prompt profile
        - Comparing tree-of-thought and frame-based exploration mechanisms for research archetypes
      skip_when:
        - Working on convergent implementation behavior owned by Cortex
      importance: high
      tags: [adhd, divergent-ideation, prompts, flux, reference]
      related:
        skills: [deep-wiki]

osrc_graph:
  - from: claude-code-system-prompts
    to: codex
    relation: contrasts_with
    note: Compare independently evolved coding-agent prompt components; do not copy either wholesale.
  - from: opencode
    to: claude-code-system-prompts
    relation: see_also
    note: OpenCode owns runtime behavior; prompt references inform model-neutral composition only.
  - from: opencode
    to: codex
    relation: see_also
    note: OpenCode owns runtime behavior; prompt references inform model-neutral composition only.
  - from: tura
    to: opencode
    relation: contrasts_with
    note: Tura is a mechanism reference; OpenCode remains the runtime contract for any proposed plugin adaptation.
  - from: adhd
    to: opencode
    relation: contrasts_with
    note: ADHD mechanisms are distilled into prompt prose only; the skill is never vendored into this repository.
